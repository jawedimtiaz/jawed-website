name: Production AI GET Runtime Reliability Gate

on:
  pull_request:
    paths:
      - "config/production-ai-get-contract.json"
      - "scripts/validate-production-ai-get.mjs"
      - ".github/workflows/production-ai-get-reliability.yml"
      - "functions/api/ai.js"
      - "lib/**"
  push:
    branches:
      - main
    paths:
      - "config/production-ai-get-contract.json"
      - "scripts/validate-production-ai-get.mjs"
      - ".github/workflows/production-ai-get-reliability.yml"
      - "functions/api/ai.js"
      - "lib/**"
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

concurrency:
  group: production-ai-get-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-ai-get:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate production AI GET runtime
        run: node scripts/validate-production-ai-get.mjs
