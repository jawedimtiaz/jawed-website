name: Interactive Tools and Content Discovery Browser Runtime Gate
concurrency:
  group: finance-tools-browser-runtime-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "assets/**"
      - "config/adsense-inventory.json"
      - "package.json"
      - "vite.config.ts"
      - "scripts/validate-career-match-browser-runtime.mjs"
      - "scripts/validate-seo-browser-metadata.mjs"
      - "scripts/validate-finance-tools-browser-runtime.mjs"
      - ".github/workflows/finance-tools-browser-runtime.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "assets/**"
      - "config/adsense-inventory.json"
      - "package.json"
      - "vite.config.ts"
      - "scripts/validate-career-match-browser-runtime.mjs"
      - "scripts/validate-finance-tools-browser-runtime.mjs"
      - ".github/workflows/finance-tools-browser-runtime.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-runtime:
    name: Interactive tools and content discovery browser runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies without generating a lockfile
        run: npm install --no-package-lock --ignore-scripts
      - name: Build the current Vite application
        run: npm run build
      - name: Verify browser tooling
        run: |
          google-chrome --version
          chromedriver --version
      - name: Start Vite preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/interactive-tools-preview.log 2>&1 &
          echo $! > /tmp/interactive-tools-preview.pid
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" != "1" ]; then cat /tmp/interactive-tools-preview.log; exit 1; fi
      - name: Run interactive tools and content discovery browser smoke
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/validate-finance-tools-browser-runtime.mjs
      - name: Run Career Match resume review browser smoke
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/validate-career-match-browser-runtime.mjs
      - name: Run route SEO metadata browser validation
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/validate-seo-browser-metadata.mjs
      - name: Show preview logs on failure
        if: failure()
        run: cat /tmp/interactive-tools-preview.log || true
