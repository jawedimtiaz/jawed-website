name: Security Supply Chain Gate
concurrency:
  group: security-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - ".gitignore"
      - ".github/workflows/**"
      - "config/security-supply-chain-contract.json"
      - "scripts/validate-security-supply-chain.mjs"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.html"
      - "**/*.css"
  push:
    branches: [main]
    paths:
      - ".gitignore"
      - ".github/workflows/**"
      - "config/security-supply-chain-contract.json"
      - "scripts/validate-security-supply-chain.mjs"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.json"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.html"
      - "**/*.css"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-supply-chain:
    name: Secrets and supply-chain baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run security supply-chain validation
        run: node scripts/validate-security-supply-chain.mjs
