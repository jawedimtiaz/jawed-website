name: Career Match Browser Runtime Gate
concurrency:
  group: career-match-browser-runtime-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - "tools/career-match-resume-review/index.html"
      - "scripts/validate-career-match-browser-runtime.mjs"
      - ".github/workflows/career-match-browser-runtime.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-runtime:
    name: Career Match browser runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify browser tooling
        run: |
          google-chrome --version
          chromedriver --version
      - name: Run production browser runtime smoke
        env:
          BASE_URL: https://phase-71-career-match-browse.jawed-website.pages.dev
        run: node scripts/validate-career-match-browser-runtime.mjs
