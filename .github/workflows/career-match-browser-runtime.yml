name: Career Match Browser Runtime Gate
concurrency:
  group: career-match-browser-runtime-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - "src/tools/CareerMatchResumeReview.tsx"
      - "src/pages/PrivacyPage.tsx"
      - "src/App.tsx"
      - "src/index.css"
      - "src/components/**"
      - "scripts/validate-career-match-browser-runtime.mjs"
      - ".github/workflows/career-match-browser-runtime.yml"
      - "package.json"
      - "vite.config.ts"
      - "scripts/validate-site-integrity.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-runtime:
    name: Career Match browser runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies without generating a lockfile
        run: npm install --no-package-lock --ignore-scripts
      - name: Build the current Vite application
        run: npm run build
      - name: Verify browser tooling
        run: |
          google-chrome --version
          chromedriver --version
      - name: Start Vite preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/career-match-preview.log 2>&1 &
          echo $! > /tmp/career-match-preview.pid
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/tools/career-match-resume-review/ > /dev/null; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" != "1" ]; then cat /tmp/career-match-preview.log; exit 1; fi
      - name: Run current React browser runtime smoke
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node scripts/validate-career-match-browser-runtime.mjs
      - name: Show preview logs on failure
        if: failure()
        run: cat /tmp/career-match-preview.log || true
