name: Phase 27G AI Matrix Verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  ai-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false

      - name: Diagnose individual AI validators
        shell: bash
        run: |
          set +e
          for validator in scripts/validate-ai-knowledge.mjs scripts/validate-ai-live-operational.mjs scripts/validate-ai-production-observability.mjs scripts/validate-ai-production-security.mjs; do
            echo "===== $validator ====="
            node "$validator"
            echo "exit=$?"
          done
          exit 0

      - name: Run deterministic AI regression matrix
        run: node scripts/validate-ai-regression.mjs
