name: Performance Baseline Gate

concurrency:
  group: performance-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "docs/performance-monetization-baseline.md"
      - "config/performance-budget.json"
      - "scripts/validate-performance-baseline.mjs"
      - "assets/js/analytics.js"
      - "index.html"
      - "_headers"
      - "ads.txt"
  push:
    branches:
      - main
    paths:
      - "docs/performance-monetization-baseline.md"
      - "config/performance-budget.json"
      - "scripts/validate-performance-baseline.mjs"
      - "assets/js/analytics.js"
      - "index.html"
      - "_headers"
      - "ads.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-baseline:
    name: Performance baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run performance baseline validation
        run: node scripts/validate-performance-baseline.mjs
