name: Production Static Asset Reliability Gate
concurrency:
  group: production-assets-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - "assets/**"
      - "config/production-asset-contract.json"
      - "scripts/validate-production-assets.mjs"
      - ".github/workflows/production-static-assets.yml"
  push:
    branches:
      - main
    paths:
    paths:
      - "assets/**"
      - "config/production-asset-contract.json"
      - "scripts/validate-production-assets.mjs"
      - ".github/workflows/production-static-assets.yml"
  workflow_dispatch:
  schedule:
    - cron: "53 */6 * * *"
permissions:
  contents: read
jobs:
  production-assets:
    name: Production static asset reliability
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run production static asset validation
        run: node scripts/validate-production-assets.mjs
