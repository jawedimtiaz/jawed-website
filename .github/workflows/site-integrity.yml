name: Site Integrity Gate

concurrency:
  group: site-integrity-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "**/*.html"
      - "assets/**"
      - "public/**"
      - "src/**"
      - "scripts/validate-production-*.mjs"
      - "scripts/validate-adsense-*.mjs"
      - "scripts/validate-ai-regression.mjs"
      - "scripts/validate-finance-calculator-regression.mjs"
      - "scripts/validate-finance-tools-browser-runtime.mjs"
      - "scripts/validate-career-match-browser-runtime.mjs"
      - "package.json"
      - "vite.config.ts"
      - "config/**"
      - "scripts/validate-site-integrity.mjs"
      - "sitemap.xml"
      - "_headers"
      - "_redirects"
      - "_routes.json"
      - ".github/workflows/site-integrity.yml"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/**"
      - "public/**"
      - "src/**"
      - "scripts/validate-production-*.mjs"
      - "scripts/validate-adsense-*.mjs"
      - "scripts/validate-ai-regression.mjs"
      - "scripts/validate-finance-calculator-regression.mjs"
      - "scripts/validate-finance-tools-browser-runtime.mjs"
      - "scripts/validate-career-match-browser-runtime.mjs"
      - "package.json"
      - "vite.config.ts"
      - "config/**"
      - "scripts/validate-site-integrity.mjs"
      - "sitemap.xml"
      - "_headers"
      - "_redirects"
      - "_routes.json"
      - ".github/workflows/site-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-integrity:
    name: Site integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Syntax-check production and project validation scripts
        run: |
          node --check scripts/validate-production-assets.mjs
          node --check scripts/validate-production-cache.mjs
          node --check scripts/validate-production-sitemap.mjs
          node --check scripts/validate-production-robots.mjs
          node --check scripts/validate-production-ai-get.mjs
          node --check scripts/validate-production-ai-post.mjs
          node --check scripts/validate-production-html-seo.mjs
          node --check scripts/validate-adsense-content-readiness.mjs
          node --check scripts/validate-adsense-privacy.mjs
          node --check scripts/validate-adsense-preactivation.mjs
          node --check scripts/validate-ai-regression.mjs
          node --check scripts/validate-finance-calculator-regression.mjs
          node --check scripts/validate-finance-tools-browser-runtime.mjs
          node --check scripts/validate-career-match-browser-runtime.mjs
      - name: Run site integrity validation
        run: node scripts/validate-site-integrity.mjs
