name: Site Integrity Gate

concurrency:
  group: site-integrity-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "**/*.html"
      - "assets/**"
      - "config/**"
      - "scripts/validate-site-integrity.mjs"
      - "sitemap.xml"
      - "_headers"
      - "_redirects"
      - "_routes.json"
      - ".github/workflows/site-integrity.yml"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/**"
      - "config/**"
      - "scripts/validate-site-integrity.mjs"
      - "sitemap.xml"
      - "_headers"
      - "_redirects"
      - "_routes.json"
      - ".github/workflows/site-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-integrity:
    name: Site integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run site integrity validation
        run: node scripts/validate-site-integrity.mjs
