name: AI Regression Gate

concurrency:
  group: ai-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "ai/**"
      - "index.html"
      - "about/**"
      - "work/**"
      - "notes/**"
      - "blog/**"
      - "tools/**"
      - "resources/**"
      - "topics/**"
      - "functions/**"
      - "assets/data/ai-knowledge.json"
      - "scripts/validate-ai-*.mjs"
      - "docs/ai-*.md"
      - "_headers"
      - "sitemap.xml"
      - ".github/workflows/ai-regression.yml"
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "ai/**"
      - "index.html"
      - "about/**"
      - "work/**"
      - "notes/**"
      - "blog/**"
      - "tools/**"
      - "resources/**"
      - "topics/**"
      - "functions/**"
      - "assets/data/ai-knowledge.json"
      - "scripts/validate-ai-*.mjs"
      - "docs/ai-*.md"
      - "_headers"
      - "sitemap.xml"
      - ".github/workflows/ai-regression.yml"


