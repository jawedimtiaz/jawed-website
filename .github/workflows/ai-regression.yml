name: AI Regression Gate

concurrency:
  group: ai-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "ai/**"
      - "index.html"
      - "about/**"
      - "work/**"
      - "notes/**"
      - "blog/**"
      - "tools/**"
      - "resources/**"
      - "topics/**"
      - "functions/**"
      - "assets/data/ai-knowledge.json"
      - "assets/js/**"
      - "scripts/validate-ai-*.mjs"
      - "docs/ai-*.md"
      - "_headers"
      - "sitemap.xml"
      - ".github/workflows/ai-regression.yml"
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "ai/**"
      - "index.html"
      - "about/**"
      - "work/**"
      - "notes/**"
      - "blog/**"
      - "tools/**"
      - "resources/**"
      - "topics/**"
      - "functions/**"
      - "assets/data/ai-knowledge.json"
      - "assets/js/**"
      - "scripts/validate-ai-*.mjs"
      - "docs/ai-*.md"
      - "_headers"
      - "sitemap.xml"
      - ".github/workflows/ai-regression.yml"

permissions:
  contents: read

jobs:
  ai-regression:
    name: AI production regression matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run site integrity validation
        run: node scripts/validate-site-integrity.mjs

      - name: Run AI regression matrix
        id: regression
        run: node scripts/validate-ai-regression.mjs

      - name: Publish release evidence
        if: always()
        env:
          RESULT: ${{ steps.regression.outcome }}
        run: |
          {
            printf '%s\n' "## AI Regression Gate"
            printf '%s\n' ""
            printf '%s\n' "- Result: $RESULT"
            printf '%s\n' "- Commit: ${GITHUB_SHA}"
            printf '%s\n' "- Ref: ${GITHUB_REF}"
            printf '%s\n' "- Node: $(node --version)"
            printf '%s\n' "- Deterministic provider-backed E2E: not asserted"
          } >> "$GITHUB_STEP_SUMMARY"
