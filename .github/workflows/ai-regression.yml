name: AI Regression Gate

concurrency:
  group: ai-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "ai/**"
      - "functions/**"
      - "assets/data/ai-knowledge.json"
      - "scripts/validate-ai-*.mjs"
      - "docs/ai-regression-*.md"
      - "_headers"
      - "sitemap.xml"
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "ai/**"
      - "functions/**"
      - "assets/data/ai-knowledge.json"
      - "scripts/validate-ai-*.mjs"
      - "docs/ai-regression-*.md"
      - "_headers"
      - "sitemap.xml"

permissions:
  contents: read

jobs:
  ai-regression:
    name: AI production regression matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run AI regression matrix
        id: regression
        run: node scripts/validate-ai-regression.mjs

      - name: Publish release evidence
        if: always()
        env:
          RESULT: ${{ steps.regression.outcome }}
        run: |
          {
            echo "## AI Regression Gate"
            echo
            echo "- Result: \`$RESULT\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Node: \`$(node --version)\`"
            echo "- Deterministic provider-backed E2E: not asserted"
          } >> "$GITHUB_STEP_SUMMARY"
