name: Security Baseline Gate

concurrency:
  group: security-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "_headers"
      - "_redirects"
      - "_routes.json"
      - "404.html"
      - "sitemap.xml"
      - "scripts/validate-security-baseline.mjs"
      - ".github/workflows/security-baseline.yml"
  push:
    branches:
      - main
    paths:
      - "_headers"
      - "_redirects"
      - "_routes.json"
      - "404.html"
      - "sitemap.xml"
      - "scripts/validate-security-baseline.mjs"
      - ".github/workflows/security-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-baseline:
    name: Security baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run security baseline validation
        run: node scripts/validate-security-baseline.mjs
