name: AdSense Readiness Gate

concurrency:
  group: adsense-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "privacy/**"
      - "scripts/validate-adsense-privacy.mjs"
      - "scripts/validate-adsense-inventory.mjs"
      - "scripts/validate-adsense-activation.mjs"
      - "scripts/validate-adsense-content-readiness.mjs"
      - "scripts/validate-adsense-placement-policy.mjs"
      - "scripts/validate-adsense-technical.mjs"
      - "scripts/validate-adsense-final-readiness.mjs"
      - "scripts/validate-adsense-preactivation.mjs"
      - "docs/adsense-final-readiness.md"
      - "docs/adsense-technical-activation.md"
      - "_headers"
      - "config/adsense-placement-policy.json"
      - "config/adsense-slot-contract.json"
      - "scripts/validate-adsense-slot-architecture.mjs"
      - "scripts/validate-adsense-mobile-readiness.mjs"
      - "config/adsense-consent-contract.json"
      - "scripts/validate-adsense-consent-performance.mjs"
      - "config/adsense-performance-safeguards.json"
      - "scripts/validate-adsense-performance-safeguards.mjs"
      - "docs/adsense-content-readiness.md"
      - "docs/adsense-activation-contract.md"
      - "config/adsense-inventory.json"
      - ".github/workflows/adsense-readiness.yml"
  push:
    branches:
      - main
    paths:
      - "privacy/**"
      - "scripts/validate-adsense-privacy.mjs"
      - "scripts/validate-adsense-inventory.mjs"
      - "scripts/validate-adsense-activation.mjs"
      - "scripts/validate-adsense-content-readiness.mjs"
      - "scripts/validate-adsense-placement-policy.mjs"
      - "scripts/validate-adsense-technical.mjs"
      - "scripts/validate-adsense-final-readiness.mjs"
      - "scripts/validate-adsense-preactivation.mjs"
      - "docs/adsense-final-readiness.md"
      - "docs/adsense-technical-activation.md"
      - "_headers"
      - "config/adsense-placement-policy.json"
      - "config/adsense-consent-contract.json"
      - "scripts/validate-adsense-consent-performance.mjs"
      - "config/adsense-performance-safeguards.json"
      - "scripts/validate-adsense-performance-safeguards.mjs"
      - "config/adsense-slot-contract.json"
      - "scripts/validate-adsense-slot-architecture.mjs"
      - "docs/adsense-content-readiness.md"
      - "docs/adsense-activation-contract.md"
      - "config/adsense-inventory.json"
      - ".github/workflows/adsense-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adsense-readiness:
    name: AdSense privacy readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run AdSense privacy readiness validation
        run: node scripts/validate-adsense-privacy.mjs

      - name: Run AdSense inventory boundary validation
        run: node scripts/validate-adsense-inventory.mjs

      - name: Run AdSense activation contract validation
        run: node scripts/validate-adsense-activation.mjs

      - name: Run AdSense content readiness validation
        run: node scripts/validate-adsense-content-readiness.mjs

      - name: Run AdSense placement policy validation
        run: node scripts/validate-adsense-placement-policy.mjs

      - name: Run AdSense technical activation validation
        run: node scripts/validate-adsense-technical.mjs

      - name: Run AdSense slot architecture validation
        run: node scripts/validate-adsense-slot-architecture.mjs

      - name: Run AdSense mobile readiness validation
        run: node scripts/validate-adsense-mobile-readiness.mjs

      - name: Run AdSense consent performance validation
        run: node scripts/validate-adsense-consent-performance.mjs

      - name: Run AdSense performance safeguards validation
        run: node scripts/validate-adsense-performance-safeguards.mjs

      - name: Run AdSense final readiness validation
        run: node scripts/validate-adsense-final-readiness.mjs

      - name: Run AdSense pre-activation guard
        run: node scripts/validate-adsense-preactivation.mjs
