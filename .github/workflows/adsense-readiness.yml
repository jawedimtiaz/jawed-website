  workflow_dispatch:

permissions:
  contents: read

jobs:
  adsense-readiness:
    name: AdSense privacy readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run AdSense privacy readiness validation
        run: node scripts/validate-adsense-privacy.mjs

      - name: Run AdSense inventory boundary validation
        run: node scripts/validate-adsense-inventory.mjs

      - name: Run AdSense activation contract validation
        run: node scripts/validate-adsense-activation.mjs

      - name: Run AdSense content readiness validation
        run: node scripts/validate-adsense-content-readiness.mjs

      - name: Run AdSense placement policy validation
        run: node scripts/validate-adsense-placement-policy.mjs

      - name: Run AdSense technical activation validation
        run: node scripts/validate-adsense-technical.mjs

      - name: Run AdSense slot architecture validation
        run: node scripts/validate-adsense-slot-architecture.mjs

      - name: Run AdSense mobile readiness validation
        run: node scripts/validate-adsense-mobile-readiness.mjs

      - name: Run AdSense consent performance validation
        run: node scripts/validate-adsense-consent-performance.mjs

      - name: Run AdSense performance safeguards validation
        run: node scripts/validate-adsense-performance-safeguards.mjs

      - name: Run final AdSense pre-activation performance gate
        run: node scripts/validate-adsense-final-performance-gate.mjs

      - name: Run AdSense final readiness validation
        run: node scripts/validate-adsense-final-readiness.mjs

      - name: Run AdSense pre-activation guard
        run: node scripts/validate-adsense-preactivation.mjs

      - name: Run aggregate AdSense readiness gate
        run: node scripts/validate-adsense-readiness.mjs
