name: Production HTML SEO Reliability Gate
concurrency:
  group: production-html-seo-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - "config/production-html-seo-contract.json"
      - "scripts/validate-production-html-seo.mjs"
      - ".github/workflows/production-html-seo-reliability.yml"
      - "**/index.html"
  push:
    branches: [main]
    paths:
      - "config/production-html-seo-contract.json"
      - "scripts/validate-production-html-seo.mjs"
      - ".github/workflows/production-html-seo-reliability.yml"
      - "**/index.html"
  workflow_dispatch:
  schedule:
    - cron: "13 */6 * * *"
permissions:
  contents: read
jobs:
  production-html-seo:
    name: Production HTML SEO reliability
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run production HTML SEO validation
        run: node scripts/validate-production-html-seo.mjs
