name: Production AI POST Reliability Gate
concurrency:
  group: production-ai-post-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - "config/production-ai-post-contract.json"
      - "scripts/validate-production-ai-post.mjs"
      - ".github/workflows/production-ai-post-reliability.yml"
      - "functions/api/ai.js"
  workflow_dispatch:
  schedule:
    - cron: "27 */6 * * *"
permissions:
  contents: read
jobs:
  production-ai-post:
    name: Production AI POST reliability
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run production AI POST validation
        run: node scripts/validate-production-ai-post.mjs
