name: Core Web Vitals Protection Gate

on:
  pull_request:
    paths:
      - "**/*.html"
      - "assets/js/analytics.js"
      - "assets/css/style.css"
      - "config/performance-budget.json"
      - "scripts/validate-core-web-vitals-protection.mjs"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/js/analytics.js"
      - "assets/css/style.css"
      - "config/performance-budget.json"
      - "scripts/validate-core-web-vitals-protection.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-web-vitals-protection:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: node scripts/validate-core-web-vitals-protection.mjs
