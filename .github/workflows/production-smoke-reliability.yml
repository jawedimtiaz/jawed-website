name: Production Smoke Reliability Gate
concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths:
      - "config/production-smoke-contract.json"
      - "scripts/validate-production-smoke.mjs"
      - ".github/workflows/production-smoke-reliability.yml"
      - "_headers"
      - "_redirects"
      - "_routes.json"
      - "404.html"
      - "index.html"
      - "sitemap.xml"
      - "ai/**"
      - "notes/**"
      - "functions/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-smoke:
    name: Production smoke reliability
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run production smoke validation
        run: node scripts/validate-production-smoke.mjs
