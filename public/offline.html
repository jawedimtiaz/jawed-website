<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="robots" content="noindex, follow" />
  <title>Offline | Jawed Imtiaz IT Field Tech</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.6;
    }
    .offline-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .offline-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: inline-block;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .offline-tools {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 1.75rem;
      text-align: left;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
    }
    .offline-tools-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .offline-tools a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .offline-tools a:hover {
      text-decoration: underline;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #0284c7;
      color: #ffffff;
      padding: 0.75rem 1.75rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: background-color 0.15s ease;
      text-decoration: none;
      min-height: 44px;
      width: 100%;
    }
    .btn:hover {
      background: var(--accent);
      color: #0f172a;
    }
    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="offline-card" role="main">
    <div class="offline-icon" aria-hidden="true">📡</div>
    <h1>You are Currently Offline</h1>
    <p>Your network connection appears to be unavailable. Previously cached field notes and diagnostic tools remain accessible:</p>
    <div class="offline-tools">
      <div class="offline-tools-title">Cached Offline Tools:</div>
      <a href="/tools">🛠️ Diagnostic &amp; IT Field Tools Hub</a>
      <a href="/tools/ipv4-subnet-calculator">🌐 IPv4 Subnet Calculator</a>
      <a href="/tools/it-resume-bullet-builder">📄 IT Resume Bullet Builder</a>
    </div>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </main>
  <script>
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
