<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brandMaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="maskGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full-bleed background rect without rounding (required for Android adaptive masking) -->
  <rect width="512" height="512" fill="url(#bgMaskGrad)" />

  <!-- Central Emblem strictly within the 80% safe zone circle (diameter 390px, radius 195px) -->
  <g transform="translate(131, 131)">
    <rect width="250" height="250" rx="56" fill="url(#brandMaskGrad)" filter="url(#maskGlow)" />
    
    <!-- Tech Accent -->
    <path d="M 32 32 L 80 32 M 170 32 L 218 32 M 218 80 L 218 128 M 32 170 L 32 218 M 170 218 L 218 218" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.3" fill="none" />
    
    <!-- Monogram Typography "JI" -->
    <text x="125" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', Arial, sans-serif" font-size="118" font-weight="900" fill="#ffffff" letter-spacing="-3">JI</text>
  </g>
</svg>
