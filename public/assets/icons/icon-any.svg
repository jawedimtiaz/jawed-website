<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Canvas Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Central Glow & Emblem Badge -->
  <g transform="translate(106, 106)">
    <!-- Inner Badge Base -->
    <rect width="300" height="300" rx="68" fill="url(#brandGrad)" filter="url(#glow)" />
    
    <!-- Subtle Tech Pattern / Accent Lines -->
    <path d="M 40 40 L 100 40 M 200 40 L 260 40 M 260 100 L 260 160 M 40 200 L 40 260 M 200 260 L 260 260" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.3" fill="none" />
    
    <!-- Monogram Typography "JI" -->
    <text x="150" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', Arial, sans-serif" font-size="142" font-weight="900" fill="#ffffff" letter-spacing="-4">JI</text>
  </g>
</svg>
